packages:
  - apps/*
  - packages/*

# One version of each shared dependency for the whole workspace.
# Reference these from package.json as "catalog:".
catalog:
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^3.0.3
  '@cloudflare/vitest-plugin': ^1.4.4
  '@commitlint/cli': ^21.2.3
  '@commitlint/config-conventional': ^21.2.3
  '@date-fns/tz': ^1.5.0
  '@electric-sql/pglite': ^0.5.10
  '@hono/node-server': ^2.1.5
  '@mitcsutt/kiln-charts': ^0.1.0
  '@mitcsutt/kiln-dnd': ^0.1.0
  '@mitcsutt/kiln-eslint-config': ^0.4.0
  '@mitcsutt/kiln-prettier-config': ^0.1.0
  '@mitcsutt/kiln-structure': ^0.1.0
  '@mitcsutt/kiln-tsconfig': ^0.2.0
  '@mitcsutt/kiln-ui': ^0.8.0
  '@redocly/cli': ^2.67.1
  '@secretlint/secretlint-rule-preset-recommend': ^13.0.7
  '@standard-schema/spec': ^1.1.0
  '@tanstack/react-query': ^5.104.5
  '@tanstack/react-router': ^1.170.46
  '@tanstack/router-plugin': ^1.168.48
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.3
  '@testing-library/user-event': ^14.6.7
  '@types/node': ^24.0.0
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitejs/plugin-react': ^6.1.1
  ajv: ^8.20.0
  date-fns: ^4.4.0
  drizzle-orm: ^0.45.4
  esbuild: ^0.28.2
  eslint: ^10.12.0
  jose: ^6.2.12
  jsdom: ^26.1.0
  lefthook: ^2.1.16
  openapi-typescript: ^7.13.0
  pg: ^8.23.1
  prettier: ^3.9.9
  publint: ^0.3.25
  react: ^19.3.0
  react-dom: ^19.3.0
  react-is: ^19.3.0
  secretlint: ^13.0.7
  turbo: ^2.11.9
  typescript: ~6.0.3
  vite: ^8.3.2
  vitest: ^5.0.5
  wrangler: ^4.151.1
  yaml: ^2.9.1
  zod: ^4.6.7

# Dependencies allowed to run install scripts (pnpm 11+ name for onlyBuiltDependencies).
allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: true
  workerd: true

peerDependencyRules:
  # eslint-plugin-jsx-a11y (inside kiln-eslint-config) has not declared ESLint 10 support
  # yet; kiln-eslint-config's own tests run its rules on ESLint 10.
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: '10'
    # openapi-typescript 7 declares TypeScript 5; the client's generator check runs it on 6.
    openapi-typescript>typescript: '6'

minimumReleaseAgeExclude:
  - '@redocly/cli@2.67.1'
  - '@tanstack/react-router@1.170.46'
  - '@tanstack/router-core@1.171.39'
  - '@tanstack/router-generator@1.167.46'
  - '@tanstack/router-plugin@1.168.48'
  - '@mitcsutt/kiln-ui@0.8.0'
