name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # CI never commits, so skip installing the Git hooks.
  LEFTHOOK: 0

# One job per quality gate, each through Turborepo. Add new gates as new jobs
# that reuse the setup action and set a timeout, and add each one to the gate's
# needs list.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: ESLint, Prettier and the secret scan
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  # Unit tests on Node and in workerd (@cloudflare/vitest-plugin), with Postgres 17 for the
  # tests that need a database. No cloud accounts.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: embertrail
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d embertrail"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/embertrail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup
      - name: Test
        run: pnpm test

  # Builds the Docker image, boots the compose stack and ingests and queries a fixture through it
  # (apps/server/smoke/smoke.sh, #37). The only job that needs Docker to run the Hub itself.
  smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Boot the stack, ingest a fixture, query it back
        run: apps/server/smoke/smoke.sh

  # The one check branch protection requires. Every new job must be added to
  # its needs list, or the gate passes without waiting for it.
  ci-passed:
    name: CI passed
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
